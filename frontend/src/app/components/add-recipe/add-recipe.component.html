<div class="add-recipe-form">
  <form #recipeForm="ngForm" (ngSubmit)="onSubmit(recipeForm)" novalidate>
    <div class="form-group">
      <label for="recipeName">Recipe Name</label>
      <input
        id="recipeName"
        type="text"
        name="recipeName"
        [(ngModel)]="recipeName"
        required
        maxlength="100"
        placeholder="e.g. Spaghetti Bolognese"
        class="form-control"
      />
    </div>

    <div class="form-group">
      <label for="ingredientInput">Add Ingredient</label>
      <div class="ingredient-input-row">
        <input
          id="ingredientInput"
          type="text"
          name="ingredientInput"
          [(ngModel)]="ingredientInput"
          placeholder="e.g. 200g spaghetti"
          class="form-control"
          (keydown)="onIngredientKeydown($event)"
          maxlength="100"
        />
        <button type="button" class="btn btn-secondary" (click)="addIngredient()">Add</button>
      </div>
    </div>

    <div *ngIf="ingredients.length > 0" class="ingredient-tags">
      <span class="tag" *ngFor="let ing of ingredients; let i = index">
        {{ ing }}
        <button type="button" class="tag-remove" (click)="removeIngredient(i)" aria-label="Remove">×</button>
      </span>
    </div>

    <div *ngIf="error" class="alert alert-error">{{ error }}</div>
    <div *ngIf="success" class="alert alert-success">{{ success }}</div>

    <button type="submit" class="btn btn-primary" [disabled]="submitting">
      {{ submitting ? 'Saving...' : 'Save Recipe' }}
    </button>
  </form>
</div>
